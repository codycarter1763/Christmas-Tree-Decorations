name: Build firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false          # show results for every board, even if one fails
      matrix:
        env: [master, receiver2, receiver3, controller]
        # *_ota envs build the same firmware as their USB twins, so they're skipped

    # If platformio.ini isn't at the repo root, set this to its folder
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-esp32v6-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: pio-esp32v6-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Local builds use the older Arduino core 2.x platform (espressif32 6.x).
      # A fresh runner would grab the latest (core 3.x), which breaks the ESP-NOW
      # callback signature. Pin CI to 6.x until platformio.ini pins it itself.
      - name: Pin ESP32 platform to 6.x (Arduino core 2.x)
        run: |
          sed -i -E 's/^platform[[:space:]]*=[[:space:]]*espressif32[[:space:]]*$/platform = espressif32 @ ^6.0.0/' platformio.ini
          grep -n '^platform' platformio.ini

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: error