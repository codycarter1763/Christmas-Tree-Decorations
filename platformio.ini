; Project layout:
;   include/                 shared headers (control_packet.h, net_config.h, effects.h, ...)
;   src/tree/                tree firmware (main.cpp, effects.cpp, espnow_control.cpp, wifi_ota.cpp)
;   src/controller/          controller firmware (main.cpp)
;
; Find your COM ports with:  pio device list

[platformio]
default_envs = master, receiver2, receiver3, controller   ; what "Build" builds

; ---- Shared by every board ----
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ---- Shared by the three trees ----
[tree]
build_src_filter = +<tree/>
board_build.partitions = min_spiffs.csv
lib_deps = adafruit/Adafruit NeoPixel

; ---- Wireless upload settings (laptop joined to "tree-lights" WiFi) ----
[ota]
upload_protocol = espota
upload_flags = --auth=*SantaPaws321

; =======================
; Trees: USB uploads
; =======================
[env:master]
extends = tree
build_flags = -D NODE_ID=1
upload_port = COM9
monitor_port = COM9

[env:receiver2]
extends = tree
build_flags = -D NODE_ID=2
upload_port = COM9
monitor_port = COM9

[env:receiver3]
extends = tree
build_flags = -D NODE_ID=3
upload_port = COM9
monitor_port = COM9

; =======================
; Trees: wireless uploads
; =======================
[env:master_ota]
extends = env:master, ota
upload_port = 192.168.4.1

[env:receiver2_ota]
extends = env:receiver2, ota
upload_port = 192.168.4.12

[env:receiver3_ota]
extends = env:receiver3, ota
upload_port = 192.168.4.13

; =======================
; Controller
; =======================
[env:controller]
board = seeed_xiao_esp32s3
build_src_filter = +<controller/>
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1     ; Serial over the XIAO's USB-C port
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
upload_port = COM8
monitor_port = COM8